<!DOCTYPE html>
<html>
<head>
  <title>AR.js Video Example (Dropbox)</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.min.js"></script>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; }
    #vid { display: none; } 
  </style>
</head>
<body>
  <video id="vid" 
         src="https://www.dropbox.com/scl/fi/2tvf3vofrpf56s4xkc1b4/hostel.mp4?rlkey=3bzjccnrdu06p8g1tyv2z37yj&st=ht7g7b9a&raw=1"
         crossorigin="anonymous"
         webkit-playsinline playsinline
         preload="auto"
         loop>
  </video>

  <a-scene embedded arjs="detectionMode: mono_and_matrix; matrixCodeType: 5x5;">
    <a-marker type="barcode" value="5">
      <a-video id="video-plane" src="#vid" position="0 0.5 0"
               rotation="-90 0 0"
               width="3" height="2">
      </a-video>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    document.body.addEventListener('click', () => {
      const vid = document.getElementById('vid');
      if (vid.paused) {
        vid.play().catch(err => console.warn("Video play failed:", err));
      }
    });
  </script>
</body>
</html>
