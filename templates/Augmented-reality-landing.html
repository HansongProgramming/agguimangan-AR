<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Agguimangan</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.min.js"></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      
      /* Keep video hidden but still in DOM */
      #vid {
        position: absolute;
        top: 0;
        left: 0;
        width: 1px;
        height: 1px;
        opacity: 0;
      }
      
      .overlay {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 10;
        display: flex;
        justify-content: center;
        align-items: center;
        width: fit-content;
        background-color: transparent;
        outline: none;
        border: none;
        opacity: 0;
        animation: fadeIn 2s forwards;
        color: white;
      }
      
      img {
        width: 40%;
        height: 20%;
      }
      
      .overlay2 {
        position: absolute;
        top: 80%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 10;
        display: flex;
        justify-content: center;
        align-items: center;
        width: fit-content;
        background-color: transparent;
        outline: none;
        border: none;
        opacity: 0;
        animation: fadeIn 2s forwards;
        animation-delay: 7s;
        color: white;
        text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.8);
        font-size: 1.5rem;
      }
      
      @keyframes fadeIn {
        to {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <button id="tapButton" onclick="tapped()" class="overlay"><img src="/static/source/tap.png" alt="tap" /></button>
    <button id="finishButton" class="overlay2" onclick="window.location.href='/main';">Tap here to start Booking!</button>

    <!-- Hidden video element -->
    <video id="vid" src="/static/source/PARAGRAPH 1 VIDEO.mp4" type="video/mp4" playsinline webkit-playsinline loop preload="auto"></video>

    <!-- A-Frame scene with AR.js -->
    <a-scene embedded arjs="detectionMode: mono_and_matrix; matrixCodeType: 5x5;">
      <a-marker type="barcode" value="5" smooth="true" smoothCount="5" smoothTolerance="0.01" smoothThreshold="5">
        <!-- Plane showing the video -->
        <a-plane id="video-plane" src="#vid" position="0 0.5 0" rotation="-90 0 0" width="3" height="2"></a-plane>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      const vid = document.getElementById('vid')
      
      vid.addEventListener('loadeddata', () => {
        console.log('Video loaded! Duration:', vid.duration, 'seconds')
      })
      
      function tapped() {
        const button = document.getElementById('tapButton')
        button.style.display = 'none'
      
        vid
          .play()
          .then(() => console.log('Video playing with audio!'))
          .catch((err) => console.warn('Video play failed:', err))
      }
    </script>
  </body>
</html>
