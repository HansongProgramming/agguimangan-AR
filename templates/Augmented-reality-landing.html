<!DOCTYPE html>
<html>
<head>
  <title>AR.js Video Example (FastAPI Proxy)</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.min.js"></script>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; }
    #vid {
      position: absolute;
      top: 0; left: 0;
      width: 1px; height: 1px;   /* keep it tiny but in DOM */
      opacity: 0;
    }
  </style>
</head>
<body>
  <!-- keep video in DOM -->
  <video id="vid"
         src="/static/source/part1.mp4"
         type="video/mp4"
         playsinline
         webkit-playsinline
         muted
         autoplay
         loop>
  </video>

  <a-scene embedded arjs="detectionMode: mono_and_matrix; matrixCodeType: 5x5;">
    <a-marker type="barcode" value="5">
      <!-- plane showing video -->
      <a-plane src="#vid"
               position="0 0.5 0"
               rotation="-90 0 0"
               width="3" height="2">
      </a-plane>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const vid = document.getElementById('vid');
    vid.addEventListener('loadeddata', () => {
      console.log("Video loaded, duration:", vid.duration);
    });

    document.body.addEventListener('click', () => {
      vid.play().catch(err => console.warn("Play failed:", err));
    });
  </script>
</body>
</html>
