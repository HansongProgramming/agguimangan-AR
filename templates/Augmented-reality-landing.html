<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Agguimangan</title>
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.6.0/dist/aframe-master.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
    <style>
      html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; }
      .overlay {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        z-index: 10; display: flex; justify-content: center; align-items: center;
        background: transparent; border: none; opacity: 0;
        animation: fadeIn 2s forwards; color: white;
      }
      img { width: 40%; height: 20%; }
      .overlay2 {
        position: absolute; top: 80%; left: 50%; transform: translate(-50%, -50%);
        z-index: 10; display: flex; justify-content: center; align-items: center;
        background: transparent; border: none; opacity: 0;
        animation: fadeIn 2s forwards; animation-delay: 7s;
        color: white; text-shadow: 1px 1px 4px rgba(0,0,0,0.8); font-size: 1.5rem;
      }
      @keyframes fadeIn { to { opacity:1; } }
    </style>
  </head>
  <body>
    <button id="tapButton" onclick="tapped()" class="overlay">
      <img src="/static/source/tap.png" alt="tap" />
    </button>
    <button id="finishButton" class="overlay2" onclick="window.location.href='/main';">
      Tap here to start Booking!
    </button>

    <a-scene vr-mode-ui="enabled: false" embedded
             arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">
      <a-assets>
        <video id="vid" src="/static/source/PARAGRAPH 1 VIDEO.mp4"
               preload="auto" playsinline webkit-playsinline loop crossorigin="anonymous"></video>
      </a-assets>

      <a-nft type="nft"
             url="https://raw.githack.com/AR-js-org/AR.js/master/aframe/examples/image-tracking/nft/trex/trex-image/trex"
             smooth="true" smoothCount="5" smoothTolerance="0.01" smoothThreshold="5">
        <a-plane id="video-plane" src="#vid" position="0 0 0" rotation="0 0 0" width="3" height="2"></a-plane>
      </a-nft>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      const vid = document.getElementById("vid");

      vid.addEventListener("loadeddata", () => {
        console.log("Video loaded! Duration:", vid.duration, "seconds");
      });

      function tapped() {
        const button = document.getElementById("tapButton");
        button.style.display = "none";
        vid.play()
          .then(() => console.log("Video playing with audio!"))
          .catch(err => console.warn("Video play failed:", err));
      }

      window.addEventListener("arjs-nft-loaded", (event) => {
        console.log("NFT markers loaded:", event.detail);
      });
    </script>
  </body>
</html>
