<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AR.js Video Example (FastAPI)</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.min.js"></script>
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
    }

    /* Keep video hidden but still in DOM */
    #vid {
      position: absolute;
      top: 0; left: 0;
      width: 1px; height: 1px;
      opacity: 0;
    }
  </style>
</head>
<body>
  <!-- Hidden video element -->
  <video id="vid"
         src="/static/source/part1.mp4"
         type="video/mp4"
         playsinline
         webkit-playsinline
         muted
         loop
         preload="auto">
  </video>

  <!-- A-Frame scene with AR.js -->
  <a-scene embedded arjs="detectionMode: mono_and_matrix; matrixCodeType: 5x5;">
    <a-marker type="barcode" value="5" smooth="true" smoothCount="5" smoothTolerance="0.01" smoothThreshold="5">
      <!-- Plane showing the video -->
      <a-plane id="video-plane"
               src="#vid"
               position="0 0.5 0"
               rotation="-90 0 0"
               width="3" height="2">
      </a-plane>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const vid = document.getElementById('vid');

    // Check when video has loaded
    vid.addEventListener('loadeddata', () => {
      console.log("Video loaded! Duration:", vid.duration, "seconds");
    });

    // Trigger video play on first user interaction
    const playVideo = () => {
      vid.play()
        .then(() => console.log("Video playing!"))
        .catch(err => console.warn("Video play failed:", err));
      // Remove listener after first click
      document.body.removeEventListener('click', playVideo);
    };

    document.body.addEventListener('click', playVideo);
  </script>
</body>
</html>
