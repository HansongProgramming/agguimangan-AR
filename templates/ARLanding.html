<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Agguimangan</title>

    <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@1c2407b26c61958baa93967b5412487cd94b290b/dist/aframe-master.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
    <script>
      window.onload = function() {
        AFRAME.registerComponent('videohandler', {
          init: function () {
            var marker = this.el;
            this.vid = document.querySelector("#vid1"); 

            marker.addEventListener('markerFound', function () {
              this.vid.play();
            }.bind(this));

            marker.addEventListener('markerLost', function() {
              this.vid.pause();
              this.vid.currentTime = 0;
            }.bind(this));
          }
        });
      };
    </script>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      video {
        position: absolute;
        top: 0;
        left: 0;
        width: 1px;
        height: 1px;
        opacity: 0;
      }

      .navButton {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        z-index: 20;
        background-color: rgba(0,0,0,0.6);
        border: none;
        color: white;
        font-size: 2rem;
        padding: 1rem;
        cursor: pointer;
        border-radius: 10px;
      }
      #leftButton { left: 10px; }
      #rightButton { right: 10px; }

      .overlay {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 10;
        display: flex;
        justify-content: center;
        align-items: center;
        width: fit-content;
        background-color: transparent;
        outline: none;
        border: none;
        opacity: 0;
        animation: fadeIn 2s forwards;
        color: white;
      }
      img {
        width: 40%;
        height: 20%;
      }
      .overlay2 {
        position: absolute;
        top: 80%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 10;
        display: flex;
        justify-content: center;
        align-items: center;
        width: fit-content;
        background-color: transparent;
        outline: none;
        border: none;
        opacity: 0;
        animation: fadeIn 2s forwards;
        animation-delay: 7s;
        color: white;
        text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.8);
        font-size: 1.5rem;
      }
      @keyframes fadeIn {
        to { opacity: 1; }
      }
      .arjs-loader {
        height: 100%;
        width: 100%;
        position: absolute;
        top: 0;
        left: 0;
        background-color: rgba(0, 0, 0, 0.8);
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .arjs-loader div {
        text-align: center;
        font-size: 1.25em;
        color: white;
      }
    </style>
  </head>
  <body>
    <button id="tapButton" onclick="tapped()" class="overlay">
      <img src="/static/source/tap.png" alt="tap" />
    </button>
    <button id="finishButton" class="overlay2" onclick="window.location.href='/signup';">
      Tap here to start Booking!
    </button>
    <button id="leftButton" class="navButton">&#9664;</button>
    <button id="rightButton" class="navButton">&#9654;</button>

    <div class="arjs-loader"><div>Loading, please wait...</div></div>

    <a-scene
      vr-mode-ui="enabled: false;"
      renderer='antialias: true; alpha: true; precision: medium;'
      embedded arjs='trackingMethod: best; sourceType: webcam; debugUIEnabled: false;'
    >
      <a-assets>
        <video id="vid1" src="/static/source/PARAGRAPH 1 VIDEO.mp4" preload="auto" loop crossorigin playsinline></video>
        <video id="vid2" src="/static/source/Paragraph 2 Video.mp4" preload="auto" loop crossorigin playsinline></video>
      </a-assets>

      <a-nft
        videohandler
        type='nft'
        url='https://raw.githack.com/HansongProgramming/agguimangan-AR/main/static/nft/icon1'
        smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5"
      >
        <a-video
          id="video-plane"
          src="#vid1"
          position='50 150 -100'
          rotation='-90 0 0'
          width='300'
          height='175'
        ></a-video>
      </a-nft>

      <a-entity camera></a-entity>
    </a-scene>

<script>
  const vids = [
    document.getElementById("vid1"),
    document.getElementById("vid2")
  ];
  const plane = document.getElementById("video-plane");
  let currentIndex = 0;

  function tapped() {
    document.getElementById("tapButton").style.display = "none";
    vids[currentIndex].muted = false;
    vids[currentIndex].play().catch(err => console.warn("Video play failed:", err));
  }

  function changeVideo(newIndex) {
    if (newIndex < 0 || newIndex >= vids.length) return;

    vids[currentIndex].pause();
    vids[currentIndex].currentTime = 0;

    currentIndex = newIndex;

    plane.setAttribute("src", `#vid${currentIndex + 1}`);
    vids[currentIndex].muted = false;
    vids[currentIndex].play().catch(err => console.warn("Play failed:", err));
  }

  document.getElementById("leftButton").addEventListener("click", () => {
    changeVideo(currentIndex - 1);
  });

  document.getElementById("rightButton").addEventListener("click", () => {
    changeVideo(currentIndex + 1);
  });
</script>

  </body>
</html>
