<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Agguimangan</title>

    <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@1c2407b26c61958baa93967b5412487cd94b290b/dist/aframe-master.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

    <script>
      window.markerManagers = [];

      AFRAME.registerComponent("videohandler", {
        schema: {
          vids: { type: "string" }, 
          target: { type: "selector" }
        },
        init: function () {
          this.videos = this.data.vids.split(",").map(v => v.trim());
          this.currentIndex = 0;
          this.marker = this.el;
          this.vid = this.data.target;

          this.marker.addEventListener("markerFound", () => {
            this.playVideo();
          });

          this.marker.addEventListener("markerLost", () => {
            this.vid.pause();
            this.vid.currentTime = 0;
          });

          window.markerManagers.push(this);
        },
        playVideo: function () {
          if (!this.vid) return;
          const src = this.videos[this.currentIndex];
          if (this.vid.src !== src) {
            this.vid.src = src;
            this.vid.load();
          }
          this.vid.play().catch(err => console.warn("Video play failed:", err));
        },
        changeVideo: function (delta) {
          this.currentIndex += delta;
          if (this.currentIndex < 0) this.currentIndex = 0;
          if (this.currentIndex >= this.videos.length) {
            this.currentIndex = this.videos.length - 1;
          }
          this.playVideo();
        }
      });

      function getActiveMarker() {
        return window.markerManagers.find(m => m.marker.object3D.visible);
      }
    </script>

    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }

      .navButton {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        z-index: 20;
        background-color: rgba(0,0,0,0.6);
        border: none;
        color: white;
        font-size: 2rem;
        padding: 1rem;
        cursor: pointer;
        border-radius: 10px;
      }
      #leftButton { left: 10px; }
      #rightButton { right: 10px; }

      .overlay, .overlay2 {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        display: flex;
        justify-content: center;
        align-items: center;
        width: fit-content;
        background-color: transparent;
        outline: none;
        border: none;
        opacity: 0;
        animation: fadeIn 2s forwards;
        color: white;
      }
      .overlay { top: 50%; }
      .overlay2 { top: 80%; animation-delay: 7s; }
      img { width: 40%; height: 20%; }
      @keyframes fadeIn { to { opacity: 1; } }

      .arjs-loader {
        height: 100%; width: 100%;
        position: absolute; top: 0; left: 0;
        background-color: rgba(0, 0, 0, 0.8);
        z-index: 9999; display: flex;
        justify-content: center; align-items: center;
      }
      .arjs-loader div { text-align: center; font-size: 1.25em; color: white; }
    </style>
  </head>
  <body>
    <button id="tapButton" onclick="tapped()" class="overlay">
      <img src="/static/source/tap.png" alt="tap" />
    </button>
    <button id="finishButton" class="overlay2" onclick="window.location.href='/signup';">
      Tap here to start Booking!
    </button>
    <button id="leftButton" class="navButton">&#9664;</button>
    <button id="rightButton" class="navButton">&#9654;</button>

    <div class="arjs-loader"><div>Loading, please wait...</div></div>

    <a-scene
      vr-mode-ui="enabled: false;"
      renderer="antialias: false; alpha: true; precision: low; logarithmicDepthBuffer: true;"
      embedded arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false; maxDetectionRate: 15;"
    >
      <a-assets>
        <video id="sharedVid" preload="auto" crossorigin webkit-playsinline playsinline></video>
      </a-assets>

      <a-entity look-at="[camera]">
      <a-nft
        videohandler="vids: https://raw.githack.com/HansongProgramming/agguimangan-AR/main/static/source/intro1.mp4, https://raw.githack.com/HansongProgramming/agguimangan-AR/main/static/source/intro2.mp4; target: #sharedVid"
        type="nft"
        url="https://raw.githack.com/HansongProgramming/agguimangan-AR/7007901edb3b1c10915de15f3fc5038918705cf2/static/nft/intro"
        smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
        <a-video src="#sharedVid" position="0 87.5 0" rotation="-90 0 0" width="300" height="175"></a-video>
      </a-nft>
      </a-entity>

      <a-entity look-at="[camera]">
      <a-nft
        videohandler="vids: https://raw.githack.com/HansongProgramming/agguimangan-AR/main/static/source/farm1.mp4, https://raw.githack.com/HansongProgramming/agguimangan-AR/main/static/source/farm2.mp4, https://raw.githack.com/HansongProgramming/agguimangan-AR/main/static/source/farm3.mp4, https://raw.githack.com/HansongProgramming/agguimangan-AR/main/static/source/farm4.mp4, https://raw.githack.com/HansongProgramming/agguimangan-AR/main/static/source/farm5.mp4; target: #sharedVid"
        type="nft"
        url="https://raw.githack.com/HansongProgramming/agguimangan-AR/7007901edb3b1c10915de15f3fc5038918705cf2/static/nft/farm"
        smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
        <a-video src="#sharedVid" position="0 0 0" rotation="-90 0 0" width="300" height="175"></a-video>
      </a-nft>
      </a-entity>

      <a-entity look-at="[camera]">
      <a-nft
        videohandler="vids: https://raw.githack.com/HansongProgramming/agguimangan-AR/main/static/source/prodcut1.mp4, https://raw.githack.com/HansongProgramming/agguimangan-AR/main/static/source/product2.mp4; target: #sharedVid"
        type="nft"
        url="https://raw.githack.com/HansongProgramming/agguimangan-AR/7007901edb3b1c10915de15f3fc5038918705cf2/static/nft/product"
        smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
        <a-video src="#sharedVid" position="0 0 0" rotation="-90 0 0" width="300" height="175"></a-video>
      </a-nft>
      </a-entity>

      <!-- About marker -->
             <a-entity look-at="[camera]">

      <a-nft
        videohandler="vids: https://raw.githack.com/HansongProgramming/agguimangan-AR/main/static/source/about1.mp4, https://raw.githack.com/HansongProgramming/agguimangan-AR/main/static/source/about2.mp4; target: #sharedVid"
        type="nft"
        url="https://raw.githack.com/HansongProgramming/agguimangan-AR/7007901edb3b1c10915de15f3fc5038918705cf2/static/nft/about"
        smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
        <a-video src="#sharedVid" position="0 0 0" rotation="-90 0 0" width="300" height="175"></a-video>
      </a-nft>
            </a-entity>


      <a-entity camera></a-entity>
    </a-scene>

    <script>
      function tapped() {
        document.getElementById("tapButton").style.display = "none";
        const active = getActiveMarker();
        if (active) {
          active.vid.muted = false;
          active.vid.play().catch(err => console.warn("Video play failed:", err));
        }
      }

      document.getElementById("leftButton").addEventListener("click", () => {
        const active = getActiveMarker();
        if (active) active.changeVideo(-1);
      });
      document.getElementById("rightButton").addEventListener("click", () => {
        const active = getActiveMarker();
        if (active) active.changeVideo(1);
      });
    </script>
  </body>
</html>
