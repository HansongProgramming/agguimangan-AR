<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slide Up Redirect</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: sans-serif;
    }

    /* Fullscreen background */
    .background {
      background: url('https://raw.githubusercontent.com/HansongProgramming/agguimangan-AR/main/source/apayaobg.png') no-repeat center center/cover;
      height: 100%;
      width: 100%;
      position: relative;
      display: flex;
      justify-content: space-evenly;
      flex-direction: column;
    }

    /* Button */
    .swipe-btn {
      background: rgba(255, 255, 255, 0.9);
      border: none;
      border-radius: 360px;
      font-size: 18px;
      font-weight: bold;
      cursor: grab;
      transition: transform 0.2s ease;
      position: relative;
      width: 20vw;
      height: 20vw;
    }

    .swipe-btn:active {
      cursor: grabbing;
    }

    .title{
      text-align: center;
      height: 40vh;
      color: white;
    }

    .scroll{
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button{
      text-align: center;
    }

    .casing{
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      background-image: linear-gradient(to bottom, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.5));
      width: fit-content;
      height: 30vh;
      border-radius: 360px;
      padding: 0.2rem;
    }

  </style>
</head>
<body>
  <div class="background">
    <div class="title">
      <h2>Welcome To</h2>
      <h1>Agguimangan</h1>
      <p>bringing you extraordinary experience</p>
    </div>
    <div class="scroll">
      <div class="casing">
        <button class="swipe-btn">Swipe</button>
      </div>
    </div>
  </div>

  <script>
    const button = document.querySelector(".swipe-btn");
    let startY = 0;
    let currentY = 0;
    let isDragging = false;

    // Drag start
    button.addEventListener("touchstart", (e) => {
      isDragging = true;
      startY = e.touches[0].clientY;
    });

    button.addEventListener("mousedown", (e) => {
      isDragging = true;
      startY = e.clientY;
    });

    // Drag move
    function onMove(y) {
      if (!isDragging) return;
      currentY = y;
      let diff = startY - currentY;
      if (diff > 0) {
        button.style.transform = `translateY(${-diff}px)`; // move button up
      }
    }

    document.addEventListener("touchmove", (e) => {
      onMove(e.touches[0].clientY);
    });

    document.addEventListener("mousemove", (e) => {
      onMove(e.clientY);
    });

    // Drag end
    function onEnd() {
      if (!isDragging) return;
      isDragging = false;
      let diff = startY - currentY;

      if (diff > 100) { // threshold
        window.location.href = "main.html";
      } else {
        button.style.transform = `translateY(0)`; // reset back
      }
    }

    document.addEventListener("touchend", onEnd);
    document.addEventListener("mouseup", onEnd);
  </script>
</body>
</html>
